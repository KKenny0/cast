<!--
  ══════════════════════════════════════════════════════════════════════
  Poster Template (Single Card)  —  card-skill  "多卡海报" mode
  ══════════════════════════════════════════════════════════════════════

  Poster mode produces ONE HTML FILE PER CARD.  A multi-slide poster is
  a set of separate 1080x1440 HTML files that share this template.

  Placeholders (replaced before rendering):
  ─────────────────────────────────────────────────────────────────────
  {{BG_COLOR}}       — background / canvas color (sets --bg)
  {{ACCENT_COLOR}}   — accent color (sets --accent)
  {{LOGO}}           — path to brand logo image
  {{BRAND_NAME}}     — brand / series name text

  {{HEADER_BLOCK}}   — running header HTML (empty for title card):
                        <div class="header">
                          <span class="running-title">…</span>
                          <span class="page-indicator">2 / 4</span>
                        </div>
  {{TITLE_BLOCK}}    — title area HTML (empty for continuation cards):
                        <div class="title-area">…</div>
  {{BODY_HTML}}      — card body content (paragraphs, items,
                        highlights, dividers, data-rows, etc.)
  {{CARD_CLASS}}     — optional card modifier class, including leading space
  {{PAGE_INFO}}      — "1 / N" page indicator text; empty for single-card
  {{COLOPHON_BLOCK}} — colophon HTML (last card only, empty for others):
                        <div class="colophon">…</div>
  ══════════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* ── Fonts ──────────────────────────────────────────────────────── */
  @import url('file://{{FONT_BASE}}/local-fonts.css');

  @font-face {
    font-family: 'XiangcuiDengcusong';
    src: url('file://{{FONT_BASE}}/XiangcuiDengcusong.ttf') format('truetype');
    font-weight: normal;
  }

  /* ── Design tokens (brand-agnostic, overridden per card) ───────── */
  :root {
    --bg:          {{BG_COLOR}};
    --surface-1:   #fbfaf6;
    --surface-2:   #e9e1d4;
    --accent:      {{ACCENT_COLOR}};
    --ink:         #2c2418;
    --ink-muted:   #6b6050;
    --hairline:    #d8cdbc;
    --radius:      6px;

    /* type system */
    --sans:     'DM Sans', -apple-system, system-ui, sans-serif;
    --zh-serif: 'XiangcuiDengcusong', Georgia, serif;
    --mono:     'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
  }

  /* ── Reset ─────────────────────────────────────────────────────── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1440px;
    background:
      radial-gradient(ellipse at 30% 18%, rgba(255, 248, 232, 0.32), transparent 58%),
      var(--bg);
  }
  body {
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ── Card container ────────────────────────────────────────────── */
  .card {
    width: 1080px;
    height: 1440px;
    background: transparent;
    position: relative;
    overflow: hidden;
    padding: 90px 80px;
    display: flex;
    flex-direction: column;
  }

  /* ── Running header (continuation cards) ───────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 48px;
  }

  .running-title {
    font: 500 24px/1 var(--sans);
    color: var(--ink-muted);
    letter-spacing: 0.01em;
  }

  .page-indicator {
    font: 500 24px/1 var(--mono);
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }

  /* ── Title area (title card only) ──────────────────────────────── */
  .title-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .title-area h1 {
    font-family: var(--zh-serif);
    font-size: 92px;
    font-weight: 400;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: 0;
    margin-bottom: 24px;
  }

  .title-area .subtitle {
    font: 400 36px/1.5 var(--zh-serif);
    color: var(--ink-muted);
    letter-spacing: -0.01em;
  }

  .title-area .topic-tag {
    display: inline-block;
    margin-top: 32px;
    padding: 10px 24px;
    background: var(--surface-1);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    font: 500 24px/1 var(--mono);
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }

  .subtitle-tag {
    display: inline-block;
    padding: 6px 16px;
    background: var(--surface-2);
    border-radius: 4px;
    font: 500 22px/1 var(--mono);
    color: var(--ink-muted);
    letter-spacing: 0.02em;
    margin-bottom: 24px;
  }

  /* ── Body content ──────────────────────────────────────────────── */
  .body-content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .body-content h2 {
    font: 400 52px/1.2 var(--zh-serif);
    color: var(--ink);
    letter-spacing: 0;
    margin-bottom: 40px;
  }

  .body-content p {
    font: 400 36px/1.68 var(--zh-serif);
    color: var(--ink);
    letter-spacing: 0;
    margin-bottom: 24px;
  }

  /* Sparse series cards use the canvas deliberately instead of looking empty. */
  .card.sparse-poster .title-area {
    flex: 0 0 auto;
    justify-content: flex-start;
    margin-bottom: 88px;
  }

  .card.sparse-poster .body-content {
    justify-content: center;
    padding-bottom: 120px;
  }

  .card.sparse-poster .body-content h2 {
    font-size: 84px;
    color: var(--accent);
    margin-bottom: 44px;
  }

  .card.sparse-poster .highlight {
    padding: 46px 48px;
    border-left-width: 8px;
  }

  .card.sparse-poster .highlight p {
    font-size: 54px;
    line-height: 1.42;
  }

  /* ── Reading notes variant ────────────────────────────────────── */
  .card.reading-notes {
    padding: 72px 76px;
  }

  .card.reading-notes .title-area {
    flex: 0 0 auto;
    justify-content: flex-start;
    padding-bottom: 30px;
    margin-bottom: 34px;
    border-bottom: 1px solid var(--hairline);
  }

  .card.reading-notes .title-area h1 {
    max-width: 880px;
    font-size: 64px;
    line-height: 1.12;
    margin-bottom: 12px;
  }

  .card.reading-notes .title-area .subtitle {
    font-size: 30px;
    line-height: 1.4;
  }

  .card.reading-notes .header {
    margin-bottom: 34px;
  }

  .card.reading-notes .body-content {
    min-height: 0;
  }

  .reading-card-title {
    font: 400 48px/1.22 var(--zh-serif) !important;
    margin-bottom: 28px !important;
  }

  .reading-unit {
    padding: 28px 0;
  }

  .reading-card-title + .reading-unit,
  .reading-unit:first-child {
    padding-top: 0;
  }

  .reading-unit + .reading-unit {
    border-top: 1px solid var(--hairline);
  }

  .reading-label {
    font: 500 24px/1.2 var(--mono);
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-bottom: 12px;
  }

  .reading-quote blockquote {
    padding-left: 24px;
    border-left: 2px solid var(--accent);
  }

  .reading-quote p,
  .reading-thought p {
    font: 400 36px/1.62 var(--zh-serif);
    margin-bottom: 0;
  }

  .reading-thought {
    margin-top: 24px;
    padding: 22px 24px;
    background: var(--surface-1);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
  }

  .reading-thought .reading-label {
    color: var(--ink-muted);
  }

  /* ── Highlight (golden sentence) ───────────────────────────────── */
  .highlight {
    padding: 28px 32px;
    border-left: 3px solid var(--accent);
    background: var(--surface-1);
    border-radius: var(--radius);
    margin: 24px 0;
  }

  .highlight p {
    font: 400 36px/1.62 var(--zh-serif);
    color: var(--ink);
    letter-spacing: 0;
    margin-bottom: 0;
  }

  /* ── Labeled items ─────────────────────────────────────────────── */
  .item {
    padding: 28px 0;
  }

  .item + .item {
    border-top: 1px solid var(--hairline);
  }

  .item .label {
    font: 500 28px/1.3 var(--mono);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }

  .item p:last-child {
    font: 400 36px/1.62 var(--zh-serif);
    color: var(--ink);
    margin-bottom: 0;
  }

  /* ── Section divider ───────────────────────────────────────────── */
  .divider {
    width: 60px;
    height: 1px;
    background: var(--hairline);
    margin: 36px 0;
  }

  /* ── Data row (key-value display) ──────────────────────────────── */
  .data-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 20px 0;
  }

  .data-row + .data-row {
    border-top: 1px solid var(--hairline);
  }

  .data-row .key {
    font: 500 28px/1.3 var(--sans);
    color: var(--ink-muted);
  }

  .data-row .value {
    font: 500 36px/1.3 var(--sans);
    color: var(--ink);
    text-align: right;
  }

  /* ── Colophon (last card footer) ───────────────────────────────── */
  .colophon {
    margin-top: auto;
    padding-top: 28px;
    border-top: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .colophon .colophon-meta {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .colophon .source-mark {
    max-width: 680px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 500 22px/1.25 var(--sans);
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }

  .colophon .brand-mark {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .colophon .brand-mark .stripe-bar {
    width: 36px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
  }

  .colophon .brand-mark span {
    font: 500 24px/1 var(--sans);
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .colophon .logo-mark {
    height: 32px;
    width: auto;
    opacity: 0.5;
  }

  .colophon .endmark {
    flex: 0 0 auto;
    font: 500 24px/1 var(--mono);
    color: var(--ink-muted);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div class="card{{CARD_CLASS}}" data-card-mode="poster">

  {{HEADER_BLOCK}}

  {{TITLE_BLOCK}}

  <div class="body-content">
    {{BODY_HTML}}
  </div>

  {{COLOPHON_BLOCK}}

</div>
</body>
</html>
